name: Jekyll build

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify site content
        run: |
          titles=(
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
            "On the Perception Bottleneck of VLMs for Chart Understanding"
            "On the Universal Truthfulness Hyperplane Inside LLMs"
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          )
          for title in "${titles[@]}"; do
            grep -Fq "$title" _site/index.html
            grep -Fq "$title" _site/publications/index.html
          done
          grep -Fq "jliugi@connect.ust.hk" _site/index.html
          grep -Fq 'href="/LJT-Homepage/publications/"' _site/index.html
          ! grep -Fq "Your Name" _site/index.html
          ! grep -Fq "Paper Title Number" _site/publications/index.html
          test ! -e _site/cv
          test ! -e _site/talks
          test ! -e _site/teaching
          test ! -e _site/portfolio
          test ! -e _site/year-archive
          test ! -e _site/markdown
